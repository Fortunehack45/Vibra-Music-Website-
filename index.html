        <h1>Vibra Music — Official Legal Disclosures &amp; Privacy Policy</h1>
        <p><strong>Application Identifier:</strong> com.fortune.vibramusic | <strong>Website:</strong> https://vibramusic.store/ | <strong>Maintainer:</strong> Fortunehack45 (fortuneema7@gmail.com)</p>
        
        <h2>01. Privacy Policy &amp; Google API Services Limited Use Compliance</h2>
        <p>Vibra Music's use and transfer to any other app of information received from Google APIs adheres to the <a href="https://developers.google.com/terms/api-services-user-data-policy" style="color:#c084fc;">Google API Services User Data Policy</a>, including the Limited Use requirements.</p>
        <p>Vibra Music is built as a local-first, free open-source Android music client licensed under GNU GPLv3. We operate no centralized user database, deploy no advertising or tracking SDKs, and perform audio playback and DSP mix analysis strictly on your device.</p>
        <p>When you choose to sign in with your Google or YouTube account, credentials and API tokens are stored in hardware-wrapped Android Keystore EncryptedSharedPreferences on your local device. We access your account strictly to retrieve your playlists, liked tracks, and listening suggestions. We do NOT transfer, sell, disclose, or broker your Google user data to any third party, data broker, advertising network, or analytics vendor. Google user data is NEVER used for serving advertisements or promotional profiling.</p>
        
        <h2>02. Data Retention &amp; Deletion</h2>
        <p>You may disconnect your Google account or delete all local cache, search history, and stored preferences at any time in the app via Settings &rarr; Clear Cache or by uninstalling the application. You may also revoke access at any time via Google Account Permissions (https://myaccount.google.com/permissions).</p>
        
        <h2>03. Terms &amp; Conditions</h2>
        <p>Vibra Music is free, open-source software licensed under GNU General Public License v3.0 (GPLv3). Vibra Music is an independent software client and does not host, store, or redistribute copyrighted music files or audio streams.</p>
